[project]
name = "training"
version = "0.1.0"
description = "Project for training a model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "onnx>=1.19.1",
  "onnxruntime>=1.19.0",
  "onnxscript>=0.5.6",
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "scikit-learn>=1.5.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
